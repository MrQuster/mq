name: Сообщение об ошибке (Bug Report)
description: Создать отчёт о сбое, дефекте или некорректном поведении MQ
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за обратную связь! Перед созданием обращения:
        1. Убедитесь, что используете последнюю версию MQ (`mq --version`).
        2. Проверьте [FAQ](https://github.com/MrQuster/mq/blob/main/docs/FAQ.md) и открытые issues.

        > **ВНИМАНИЕ ПО БЕЗОПАСНОСТИ:**
        > **НЕ вставляйте токены, пароли, логины и приватные ключи!**
        > Удаляйте персональные данные и токены сессий из логов перед отправкой.
  - type: input
    id: mq_version
    attributes:
      label: Версия MQ
      description: Укажите версию лаунчера (например, `v2.2.0` или вывод `mq --version`)
      placeholder: v2.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      description: Выберите вашу ОС
      options:
        - Linux (Arch / Manjaro)
        - Linux (Ubuntu / Debian / Mint)
        - Linux (Fedora / RHEL)
        - Linux (другой дистрибутив)
        - Windows 11
        - Windows 10
        - Windows (другая версия)
    validations:
      required: true
  - type: input
    id: game_loader
    attributes:
      label: Версия Minecraft и загрузчик модов
      description: "Например: 1.20.1 / Fabric 0.15.11, или 1.21.1 / Vanilla"
      placeholder: "1.20.1 / Fabric 0.15.11"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите пошагово, как вызвать проблему
      placeholder: |
        1. Запустить 'mq'
        2. Открыть вкладку '...'
        3. Нажать кнопку '...'
        4. Происходит ошибка
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти
      placeholder: Лаунчер должен успешно запустить инстанс
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле
      placeholder: Появляется ошибка ..., процесс аварийно завершается
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи и диагностика (mq doctor / логи запуска)
      description: |
        Прикрепите вывод `mq doctor` или фрагмент лога.
        НЕ вставляйте токены, пароли и приватные ключи!
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Чек-лист проверки
      options:
        - label: Я проверил(а), что логи и отчёты НЕ содержат паролей, токенов авторизации и приватных данных
          required: true
        - label: Я проверил(а), что эта проблема ещё не была описана в закрытых или открытых issues
          required: true
