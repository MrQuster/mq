name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev tar gzip

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Rust Cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-linux-

      - name: Build release binary
        run: cargo build --release -p mq-cli

      - name: Prepare Linux artifacts
        run: |
          mkdir -p dist
          cp target/release/mq dist/mq-linux-x86_64
          chmod +x dist/mq-linux-x86_64

          # Package tarball with desktop integration
          mkdir -p dist/package/bin dist/package/share/applications dist/package/share/icons/hicolor/scalable/apps
          cp target/release/mq dist/package/bin/mq
          cp packaging/mq.desktop dist/package/share/applications/
          cp packaging/mq.svg dist/package/share/icons/hicolor/scalable/apps/
          tar -czf dist/mq-linux-x86_64.tar.gz -C dist/package bin share
          rm -rf dist/package

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-linux
          path: |
            dist/mq-linux-x86_64
            dist/mq-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Rust Cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-win-

      - name: Build release binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p mq-cli

      - name: Verify static CRT
        shell: pwsh
        run: |
          $exe = "target\release\mq.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\Hostx64\x64\*" } | Select-Object -First 1
            if ($dumpbin) {
              $deps = (& $dumpbin.FullName /dependents $exe) -join "`n"
              Write-Host $deps
              if ($deps -match "VCRUNTIME140") {
                throw "mq.exe unexpectedly depends on VCRUNTIME140.dll"
              }
            }
          }

      - name: Prepare Windows standalone and portable artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\mq.exe -Destination dist\mq-windows-x86_64.exe

          # Build portable package
          $portableDir = "dist\mq-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item target\release\mq.exe -Destination "$portableDir\mq.exe"
          Copy-Item packaging\windows\portable.flag -Destination "$portableDir\portable.flag"
          Copy-Item packaging\windows\run.bat -Destination "$portableDir\run.bat"
          Copy-Item packaging\windows\README-portable.txt -Destination "$portableDir\README.txt"
          New-Item -ItemType Directory -Force -Path "$portableDir\data" | Out-Null
          
          Compress-Archive -Path "$portableDir\*" -DestinationPath dist\mq-windows-x86_64-portable.zip -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          iscc /DMyAppVersion="$ver" packaging\windows\mq.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: |
            dist\mq-windows-x86_64.exe
            dist\mq-windows-x86_64-portable.zip
            dist\MQ-Setup-*-x64.exe

  publish:
    name: Sign, Attest & Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-temp

      - name: Organize release files
        run: |
          mkdir -p release-assets
          find release-temp -type f -exec cp {} release-assets/ \;
          cp install.sh release-assets/
          cp install.ps1 release-assets/
          chmod +x release-assets/install.sh
          ls -la release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with Minisign
        env:
          MQ_SIGNING_KEY: ${{ secrets.MQ_SIGNING_KEY }}
        run: |
          # Install minisign
          curl -fsSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar xz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/

          # Sign SHA256SUMS
          echo "$MQ_SIGNING_KEY" > /tmp/mq-signing.key
          minisign -S -s /tmp/mq-signing.key -m release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig -t "MQ Launcher Official Release Signature"
          rm -f /tmp/mq-signing.key

          # Verify signature with official public key
          minisign -Vm release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig -P RWRlxrUOJgeLq7AIndJRG9ZhsdT5QiHy9usykXvxt1C49a1h/km3h9lt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: 'release-assets/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ github.ref_name }}
          name: "MQ Launcher ${{ github.ref_name }} (Solid Edition)"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 MQ Launcher ${{ github.ref_name }} — Solid Edition
            
            High-Performance Multi-Threaded Minecraft Launcher with full parity for Windows 10/11 & Linux.
            
            ### 📥 1-Command Installation
            
            #### 🐧 Linux (Arch / Ubuntu / Fedora / Debian / NixOS):
            ```bash
            curl -fsSL https://github.com/MrQuster/mq/releases/latest/download/install.sh | sh
            ```
            
            #### 🪟 Windows 10 / 11 (PowerShell):
            ```powershell
            irm https://github.com/MrQuster/mq/releases/latest/download/install.ps1 | iex
            ```
            
            Or download the standalone Inno Setup installer (`MQ-Setup-<version>-x64.exe`) or portable ZIP (`mq-windows-x86_64-portable.zip`).
            
            ---
            
            ### 🔐 Release Verification (Minisign Ed25519)
            
            Official Public Key:
            ```
            RWRlxrUOJgeLq7AIndJRG9ZhsdT5QiHy9usykXvxt1C49a1h/km3h9lt
            ```
            
            Verify signature:
            ```bash
            minisign -Vm SHA256SUMS -P RWRlxrUOJgeLq7AIndJRG9ZhsdT5QiHy9usykXvxt1C49a1h/km3h9lt
            sha256sum -c SHA256SUMS
            ```
