name: CI

on:
  push:
    branches: [ "main", "integration" ]
  pull_request:
    branches: [ "main", "integration" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e0d9b439c2982d6b38466e3eb33f9261a9ec15e0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Test Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e0d9b439c2982d6b38466e3eb33f9261a9ec15e0 # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-linux-

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run installer tests
        run: bash scripts/test-installer.sh

      - name: Build release binary
        run: cargo build --release -p mq-cli

      - name: Dry-run launch verification
        run: |
          ./target/release/mq --version
          ./target/release/mq launch --dry-run || true

  test-windows:
    name: Test & Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e0d9b439c2982d6b38466e3eb33f9261a9ec15e0 # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4.2.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-win-

      - name: Windows Unit Tests
        run: cargo test --workspace

      - name: Build Release mq.exe
        run: cargo build --release -p mq-cli

      - name: Verify Windows binary
        run: .\target\release\mq.exe --version
