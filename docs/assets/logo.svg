<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="primaryEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Inner ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.08" filter="url(#glow)"/>

  <!-- Stylized Geometric "MQ" Monogram & Multithread Hypercube -->
  <g transform="translate(106, 116)">
    <!-- Letter M (Left Structure) -->
    <path d="M 30 240 L 30 40 L 80 40 L 140 160 L 200 40 L 250 40 L 250 240 L 195 240 L 195 120 L 145 220 L 135 220 L 85 120 L 85 240 Z" fill="url(#primaryEmerald)"/>

    <!-- Geometric Q accent / Quantum Data Orbit -->
    <path d="M 230 150 C 230 100 270 60 320 60 C 370 60 410 100 410 150 C 410 200 370 240 320 240 C 295 240 273 230 257 214 L 290 185 C 298 193 308 198 320 198 C 347 198 368 177 368 150 C 368 123 347 102 320 102 C 293 102 272 123 272 150 C 272 158 274 165 278 171 L 246 200 C 236 186 230 169 230 150 Z" fill="url(#accentCobalt)"/>
    <!-- Q Kick Tail -->
    <path d="M 305 185 L 355 240 L 395 240 L 340 180 Z" fill="url(#primaryEmerald)"/>
  </g>

  <!-- Speed / Multithread Data Particles -->
  <circle cx="120" cy="120" r="6" fill="#34D399" opacity="0.8"/>
  <circle cx="390" cy="110" r="5" fill="#60A5FA" opacity="0.8"/>
  <circle cx="410" cy="380" r="6" fill="#10B981" opacity="0.8"/>
  <circle cx="100" cy="370" r="5" fill="#3B82F6" opacity="0.8"/>
</svg>
