[package]
name = "mq-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Cryptographically verified self-update engine and atomic binary replacer for MQ"
keywords = ["minecraft", "update", "self-update", "minisign"]
categories = ["development-tools", "os"]

[dependencies]
mq-core.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["process", "fs", "io-util", "sync", "time"] }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
minisign-verify.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "fs"] }

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
minisign.workspace = true
