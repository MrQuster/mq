[package]
name = "mq-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface and diagnostic doctor for the MQ Minecraft launcher"
keywords = ["minecraft", "launcher", "cli", "terminal", "doctor"]
categories = ["command-line-utilities"]

[[bin]]
name = "mq"
path = "src/main.rs"

[features]
test-hooks = ["mq-ui/test-hooks"]

[dependencies]
mq-core.workspace = true
mq-sched.workspace = true
mq-net.workspace = true
mq-meta.workspace = true
mq-install.workspace = true
mq-mods.workspace = true
mq-auth.workspace = true
mq-instances.workspace = true
mq-launch.workspace = true
mq-ui.workspace = true
mq-update.workspace = true
testsupport.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sysinfo.workspace = true
image.workspace = true
sha1.workspace = true
hex.workspace = true
reqwest.workspace = true
chrono.workspace = true
uuid.workspace = true
wgpu = "24"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
